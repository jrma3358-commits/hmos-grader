<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMOS — 채점 대시보드</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 6탭 대시보드 (오종래 2026-10-17) — 문항 입력 · 인식 결과 · 채점 결과 · 루브릭 · 모범답안 · 교사 확정.
   판정 · 값 · 다경로 · 오류 이름은 모두 엔진 출력 그대로 보인다. 화면이 새로 판정하지 않는다 (교사 확정 탭의 재집계만 — 엔진 게이트 사슬 · 상한비 그대로) */
:root{--teal:#1A4A4A;--teal-mid:#2A6060;--gold:#C8A84B;--gold-lt:#F6EFD9;--ivory:#F7F5F0;--ivory-dk:#EDE9E1;--line:#DDD8CC;--muted:#7A7A7E;--ink:#1C1C1E;--white:#FFFFFF;--radius:6px;
  --B:#2A7A2A;--C:#1A5A9A;--P:#7A2A9A;--D:#C85A00;--Q:#C82020;--ok:#2E7D32;--ok-bg:#E8F5E9;--no:#C62828;--no-bg:#FFEBEE;--un:#8D6E00;--un-bg:#FFF8E1}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;font-size:14px}
button{font-family:inherit}
.topbar{min-height:54px;background:var(--teal);display:flex;align-items:center;padding:0 24px;gap:4px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.brand{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:600;color:#fff;margin-right:28px;text-decoration:none}
.brand em{font-style:normal;color:var(--gold);font-size:11px;font-family:'Noto Sans KR',sans-serif;font-weight:300;margin-left:6px}
.tab{display:flex;align-items:center;gap:7px;padding:0 14px;height:54px;border:none;background:transparent;font-size:13px;color:rgba(255,255,255,.55);border-bottom:3px solid transparent;cursor:pointer}
.tab:hover{color:rgba(255,255,255,.85)}
.tab.active{color:#fff;border-bottom-color:var(--gold);font-weight:500}
.tab-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(255,255,255,.12)}
.tab.active .tab-num{background:var(--gold);color:var(--teal)}
.recbar{background:var(--white);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.recbar label{font-size:12px;color:var(--muted)}
.recbar select{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);font-family:inherit;font-size:13px;min-width:280px;max-width:100%;background:var(--white)}
.recinfo{font-size:13px;color:var(--ink);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.recinfo .score{font-weight:700;color:var(--teal)}
.content{flex:1;max-width:1040px;width:100%;margin:0 auto;padding:28px 24px 60px}
.panel{display:none}
.panel.active{display:block}
.sec-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:600;color:var(--teal);margin-bottom:6px}
.sec-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:14px;font-weight:600;color:var(--teal);margin-bottom:10px}
.label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.pre{white-space:pre-wrap;line-height:1.75;font-size:14px}
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--white);border:1px dashed var(--line);border-radius:8px}
.err{padding:14px 16px;background:var(--no-bg);color:var(--no);border-radius:6px;margin-bottom:12px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.topbar{flex-wrap:nowrap;overflow-x:auto}.brand{margin-right:12px;white-space:nowrap}.tab{white-space:nowrap;flex:none}.grid2{grid-template-columns:1fr}.content{padding:20px 16px 48px}.topbar,.recbar{padding-left:16px;padding-right:16px}}
/* 입력 */
.field{margin-bottom:12px}
.field textarea,.field input,.field select{width:100%;padding:10px 12px;border:1.5px solid #C8C4BA;border-radius:6px;font-family:inherit;font-size:14px;line-height:1.7;background:var(--white);outline:none}
.field textarea:focus,.field input:focus{border-color:var(--teal-mid)}
.field textarea{resize:vertical;min-height:90px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1;min-width:140px}
.field-pick{display:inline-flex;border:1.5px solid var(--teal);border-radius:8px;overflow:hidden;margin-bottom:14px}
.field-pick button{border:none;background:var(--white);color:var(--teal);padding:9px 22px;font-size:14px;cursor:pointer}
.field-pick button+button{border-left:1.5px solid var(--teal)}
.field-pick button.on{background:var(--teal);color:#fff;font-weight:600}
.field-pick.small button{padding:7px 16px;font-size:13px}
.src-box{border:1px solid var(--ivory-dk);border-radius:8px;padding:14px 16px;margin-bottom:16px;background:#FCFBF8}
.up{display:inline-flex;gap:6px;align-items:center;margin-left:10px;font-weight:400;letter-spacing:0;flex-wrap:wrap}
.up-btn{font-size:12px;color:var(--teal);border:1px solid var(--teal);border-radius:5px;padding:2px 9px;cursor:pointer;background:var(--white)}
.up-btn:hover{background:var(--ivory)}
.up-st{font-size:12px;color:var(--muted);font-weight:400}
.up-st.bad{color:var(--no)}
tr.off td{color:var(--muted)}
tr.pick{cursor:pointer}
.wait{background:var(--gold-lt);border:1px dashed var(--gold);border-radius:8px;padding:18px 20px;color:#6A5212;font-size:14px;line-height:1.7}
.field-lane{display:flex;align-items:center;gap:10px;margin:4px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--teal)}
.field-lane .fname{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:600;color:var(--teal)}
.field-lane .fsub{font-size:12px;color:var(--muted)}
.field-lane.later{border-bottom-color:var(--gold)}
.field-lane.later .fname{color:#8A6A10}
.run-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:var(--teal);color:#fff;border:none;border-radius:var(--radius);font-size:13.5px;font-weight:500;cursor:pointer}
.run-btn:hover{background:var(--teal-mid)}
.run-btn:disabled{background:var(--muted);cursor:not-allowed}
.ghost-btn{padding:9px 18px;background:var(--ivory-dk);color:var(--ink);border:none;border-radius:var(--radius);font-size:13px;cursor:pointer}
.status{font-size:13px;color:var(--muted);margin-left:12px}
/* 인식 */
.chip{display:inline-block;padding:4px 11px;border-radius:14px;font-size:12.5px;font-weight:500;color:#fff;margin:0 6px 6px 0}
.node-list{display:flex;flex-wrap:wrap;gap:6px}
.node{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--ivory);border-radius:6px;border:1px solid var(--ivory-dk);font-size:13px}
.node b{min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.node.key{border:1.5px solid var(--gold);background:var(--gold-lt)}
.pivot{border:1.5px solid var(--gold);border-radius:8px;padding:14px 18px;background:var(--white);margin-bottom:14px}
.pivot .t{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:4px}
.pivot .e{font-size:16px;font-weight:600}
/* 채점 */
.scorebox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.scorebox .big{font-size:34px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.scorebox .of{font-size:16px;color:var(--muted)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.tag{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--ivory-dk);color:var(--ink)}
.tag.no{background:var(--no-bg);color:var(--no)}
.tag.un{background:var(--un-bg);color:var(--un)}
.piece{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:10px;background:var(--white)}
.piece-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mark{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.mark.O{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.mark.X{background:var(--no-bg);color:var(--no);border:1.5px solid var(--no)}
.mark.U{background:var(--un-bg);color:var(--un);border:1.5px solid var(--un);font-size:12px}
.pid{font-weight:600}
.part{font-size:12px;color:var(--muted)}
.pts{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.pts b{color:var(--ink)}
.errline{margin-top:8px;font-size:13px;line-height:1.6;display:flex;gap:6px;align-items:baseline;cursor:pointer}
.errline .ename{color:var(--no);font-weight:600;white-space:nowrap}
.errline .why{color:#444;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.errline.open .why{white-space:normal}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.val{border-radius:6px;padding:7px 10px;font-size:13px;background:var(--ivory)}
.val .k{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.val .v{font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.vals.same .val.s{background:var(--ok-bg)}
.vals.diff .val.s{background:var(--no-bg)}
.multi{margin-top:8px;border:1.5px solid var(--gold);background:var(--gold-lt);border-radius:6px;padding:9px 12px;font-size:13px;line-height:1.6}
.multi .h{font-weight:700;color:#8A6A10;margin-bottom:2px}
.multi code{font-family:inherit;background:rgba(255,255,255,.7);padding:1px 6px;border-radius:4px}
.warn{margin-top:10px;font-size:13px;color:var(--un);background:var(--un-bg);border-radius:6px;padding:8px 12px}
/* 루브릭 표 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--ivory-dk);padding:8px 8px;text-align:left;vertical-align:top;line-height:1.55}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--ivory)}
.tbl-wrap{overflow-x:auto}
/* 교사 확정 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:var(--white);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.O{background:var(--ok-bg);color:var(--ok);font-weight:700}
.seg button.on.X{background:var(--no-bg);color:var(--no);font-weight:700}
.seg button.on.U{background:var(--un-bg);color:var(--un);font-weight:700}
.changed{font-size:12px;color:#8A6A10;background:var(--gold-lt);padding:2px 8px;border-radius:10px;white-space:nowrap}
.fix{display:flex;align-items:center;gap:8px}
#p6 td:first-child,#p6 td:nth-child(2),#p6 td:nth-child(3){white-space:nowrap}
.cmp{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline}
.cmp div{font-size:13px;color:var(--muted)}
.cmp b{font-size:24px;color:var(--teal);font-variant-numeric:tabular-nums;margin-left:6px}
/* 채점 샘플 */
.qgroup{margin-bottom:28px}
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.qhead .qn{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:600;color:var(--teal)}
.qtext{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.lane{font-size:12px;font-weight:700;letter-spacing:.04em;margin:14px 0 8px}
.lane.ok{color:var(--ok)}
.lane.no{color:var(--no)}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sample{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.sample:hover{border-color:var(--teal-mid)}
.sample.ok{border-top:3px solid var(--ok)}
.sample.multi-path{border-top:3px solid var(--gold)}
.sample.no{border-top:3px solid var(--no)}
.sample-head{display:flex;align-items:baseline;gap:8px}
.sample-head .who{font-weight:600}
.sample-head .sc{margin-left:auto;font-size:20px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.sample-head .sc small{font-size:12px;color:var(--muted);font-weight:400}
.path-name{font-size:13px;line-height:1.55}
.path-name .m{color:#8A6A10;font-weight:600}
.path-name .e{color:var(--no);font-weight:600}
.where{font-size:12px;color:#555;line-height:1.6}
.strip{display:flex;flex-wrap:wrap;gap:4px}
.dot{min-width:26px;height:22px;padding:0 5px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.dot.O{background:var(--ok-bg);color:var(--ok)}
.dot.X{background:var(--no-bg);color:var(--no)}
.dot.U{background:var(--un-bg);color:var(--un)}
.ans{font-size:12px;color:#555;background:var(--ivory);border-radius:6px;padding:7px 9px;white-space:pre-wrap;line-height:1.55;max-height:5.6em;overflow:hidden}
.same-err{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<nav class="topbar">
  <a class="brand" href="/">HMOS <em>채점 대시보드</em></a>
  <button class="tab active" data-tab="1"><span class="tab-num">1</span>문항 입력</button>
  <button class="tab" data-tab="2"><span class="tab-num">2</span>인식 결과</button>
  <button class="tab" data-tab="3"><span class="tab-num">3</span>채점 결과</button>
  <button class="tab" data-tab="4"><span class="tab-num">4</span>루브릭</button>
  <button class="tab" data-tab="5"><span class="tab-num">5</span>모범답안</button>
  <button class="tab" data-tab="6"><span class="tab-num">6</span>교사 확정</button>
  <button class="tab" data-tab="7"><span class="tab-num">7</span>채점 샘플</button>
</nav>
<div class="recbar">
  <label for="rec-select">채점 결과</label>
  <select id="rec-select"><option value="">불러오는 중…</option></select>
  <div class="recinfo" id="rec-info"></div>
</div>
<div class="content">
  <section class="panel active" id="p1"></section>
  <section class="panel" id="p2"></section>
  <section class="panel" id="p3"></section>
  <section class="panel" id="p4"></section>
  <section class="panel" id="p5"></section>
  <section class="panel" id="p6"></section>
  <section class="panel" id="p7"></section>
</div>

<script>
// ── 상태 ── 지금 보는 기록 하나: 검증/ 폴더 JSON 또는 탭1에서 새로 채점한 결과 (같은 꼴: 문항 · 계열 · 정답 · 모범답안 · 학생답 · 루브릭 · 채점)
let 목록 = [];
let 기록 = null;
let 기록키 = '';
let 교사 = {}; // 소문항 자리 → { 조각id: 'O'|'X'|'판정불가' } — 엔진 판정과 다를 때만

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const 점 = (x) => (Math.round(Number(x || 0) * 10) / 10).toFixed(1); // 총점 0.1 단위
const 색 = { B: 'var(--B)', C: 'var(--C)', P: 'var(--P)', D: 'var(--D)', Q: 'var(--Q)' };
const 색이름 = { B: '대상', C: '제약', P: '상황', D: '정의', Q: '질문' };
const 파트들 = ['근거대기', '세우기', '풀기', '답구하기'];

function 탭(n) {
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === String(n)));
  document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.id === 'p' + n));
  try { localStorage.setItem('hmos-d2-tab', String(n)); } catch (_) {}
}
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => 탭(b.dataset.tab)));

async function 받기(url, opt) {
  const r = await fetch(url, { credentials: 'same-origin', ...opt });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

// ── 기록 고르기 ──
async function 목록받기() {
  const sel = $('#rec-select');
  try {
    목록 = (await 받기('/api/results')).목록 || [];
  } catch (e) {
    sel.innerHTML = '<option value="">불러오지 못함</option>';
    $('#rec-info').innerHTML = `<span style="color:var(--no)">${esc(e.message)}</span>`;
    $('#p7').innerHTML = '<div class="sec-title">채점 샘플</div>' + `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  const 묶음 = {};
  for (const x of [...목록].sort((a, b) => a.파일.localeCompare(b.파일, 'ko', { numeric: true }))) (묶음[x.문항번호 || '기타'] ??= []).push(x);
  sel.innerHTML = '<option value="">— 검증/ 채점 결과를 고르세요 —</option>' + Object.keys(묶음).sort().map((k) =>
    `<optgroup label="${esc(k)}">${묶음[k].map((x) => `<option value="${esc(x.파일)}">${esc(x.학생 || x.파일)} · ${점(x.부분점수)}/${점(x.만점)} · ${esc(x.파일)}</option>`).join('')}</optgroup>`).join('');
  그리기7();
  let 처음 = '';
  try { 처음 = new URLSearchParams(location.search).get('f') || localStorage.getItem('hmos-d2-file') || ''; } catch (_) {}
  if (처음 && 목록.some((x) => x.파일 === 처음)) { sel.value = 처음; 열기(처음); }
}
$('#rec-select').addEventListener('change', (e) => e.target.value && 열기(e.target.value));

async function 열기(파일) {
  try {
    // .json을 떼고 부른다 — nginx가 .json으로 끝나는 주소를 막는다 (서버가 붙인다)
    const j = await 받기('/api/results/' + encodeURIComponent(파일.replace(/\.json$/, '')));
    보이기(j, '파일:' + 파일);
    try { localStorage.setItem('hmos-d2-file', 파일); } catch (_) {}
  } catch (e) {
    $('#rec-info').innerHTML = `<span style="color:var(--no)">${esc(e.message)}</span>`;
  }
}

function 보이기(j, 키) {
  기록 = j;
  기록키 = 키;
  교사 = {};
  try { 교사 = JSON.parse(localStorage.getItem('hmos-d2-teacher:' + 키) || '{}'); } catch (_) {}
  그리기();
}

const 소문항들 = () => (기록?.루브릭?.out?.소문항 || []);
const 채점of = (s, i) => (기록?.채점 || []).find((g) => (g.번호 ?? null) === (s.번호 ?? null)) || (기록?.채점 || [])[i];
const 자리 = (s, i) => String(s.번호 ?? i);

function 그리기() {
  const 총 = (기록?.채점 || []).reduce((a, g) => a + Number(g.out?.부분점수 || 0), 0);
  const 만 = (기록?.채점 || []).reduce((a, g) => a + Number(g.out?.만점 || 0), 0);
  const 엔진 = (기록?.채점 || [])[0]?.out?.엔진?.commit;
  $('#rec-info').innerHTML = 기록 ? `<span>${esc(기록.학생 || '학생')}</span><span class="score">${점(총)} / ${점(만)}</span><span class="muted">계열 ${esc(기록.계열 || '')}${엔진 ? ` · 엔진 ${esc(엔진)}` : ''}</span>` : '';

/** 채점 — 불러온 문항: 확정 루브릭 소문항 그대로 /api/grade · 새 문항: /api/rubric → /api/grade */
async function 새채점() {
  const 학생답 = $('#in-st').value.trim();
  const st = $('#in-status'), btn = $('#in-run');
  if (입력계열 !== '수리·과학') { st.textContent = '인문·사회 계열은 준비 중입니다'; return; }
  const 학생 = $('#in-n').value.trim() || '새 학생';
  const 보내기 = (url, body) => 받기(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (문항방식 === '분석') {
    const u = 분석단위().find((x) => x.key === 분석.고른);
    if (!u) { st.textContent = '채점할 문항(소문항)을 고르세요'; return; }
    if (!학생답) { st.textContent = '학생 답안을 넣으세요'; return; }
    btn.disabled = true;
    try {
      st.textContent = '채점 중… (확정 루브릭)';
      const out = await 보내기('/api/grade', { 소문항: u.s, 학생답, 계열: u.계열 });
      const 만점 = u.s.조각.reduce((a, c) => a + (Number(c.배점) || 0), 0);
      st.textContent = '채점 끝 — 탭3에서 보세요';
      $('#rec-select').value = '';
      보이기({ 학생, 문항: u.논제, 계열: u.계열, 정답: String(u.m.정답 || ''), 모범답안: 모범글(u.s) || String(u.m.모범답안 || ''), 학생답,
        루브릭: { status: 200, out: { 계열: u.계열, 총배점: 만점, 소문항: [u.s] } }, 채점: [{ 번호: u.s.번호 ?? null, status: 200, out }] }, '분석:' + u.key + ':' + Date.now());
      탭(3);
    } catch (e) { st.textContent = '채점 실패: ' + e.message; } finally { btn.disabled = false; }
    return;
  }
  const 문항 = $('#in-q').value.trim(), 모범답안 = $('#in-m').value.trim();
  if (!문항 || !학생답) { st.textContent = '문항과 학생 답안을 넣으세요'; return; }
  btn.disabled = true;
  try {
    st.textContent = '루브릭 만드는 중… (엔진 · 조각 문장)';
    const 계열 = '수리'; // 수리·과학 = 지금 엔진 그대로
    const 루브릭 = await 보내기('/api/rubric', { 논제: 문항, 계열, 총배점: Number($('#in-p').value) || 5, 이어받기: true, 공통자료: true, 모범답안: 모범답안 || undefined, 정답: $('#in-a').value.trim() || undefined });
    const 채점 = [];
    for (const s of 루브릭.소문항 || []) {
      if (!s.조각 || !s.조각.length) { 채점.push({ 번호: s.번호 ?? null, 건너뜀: s.멈춤 || '조각 없음' }); continue; }
      st.textContent = `채점 중… ${s.번호 ? '(' + s.번호 + ')' : ''}`;
      const out = await 보내기('/api/grade', { 소문항: s, 학생답, 계열: 루브릭.계열 });
      채점.push({ 번호: s.번호 ?? null, status: 200, out });
    }
    st.textContent = '채점 끝 — 탭3에서 보세요';
    $('#rec-select').value = '';
    보이기({ 학생, 문항, 계열: 루브릭.계열, 정답: $('#in-a').value.trim(), 모범답안, 학생답, 루브릭: { status: 200, out: 루브릭 }, 채점 }, '새:' + Date.now());
    탭(3);
  } catch (e) { st.textContent = '채점 실패: ' + e.message; } finally { btn.disabled = false; }
}

function 조각카드(x) {

  }).join('');
}

// ── 탭6 교사 확정 ── 조각 판정을 교사가 확정 · 고친다. 점수는 엔진 게이트 사슬 · 상한비로 다시 센다 (엔진 g1 집계 · /dashboard 채점집계와 같은 계산)
function 재집계(o, 고침) {
  const 조각 = o.조각별.map((x) => ({ ...x, 판정: 고침[x.조각id] ?? x.결과 }));
  const 합 = (xs, f) => xs.reduce((a, x) => a + f(x), 0);
  const 파트배점 = Object.fromEntries(파트들.map((p) => [p, 합(조각.filter((x) => x.파트 === p), (x) => x.배점)]));
  const 상한 = {};
  for (const [X파트, 상한파트] of o.게이트?.사슬 || []) {
    if (조각.some((x) => x.파트 === X파트 && x.판정 === 'X')) 상한[상한파트] = Math.round(파트배점[상한파트] * o.게이트.상한비 * 10) / 10;
  }
  const 점수 = 합(파트들, (p) => { const 원 = 합(조각.filter((x) => x.파트 === p && x.판정 === 'O'), (x) => x.배점); return 상한[p] != null ? Math.min(원, 상한[p]) : 원; });
  return { 부분점수: Math.round(점수 * 100) / 100, 만점: Math.round(합(조각, (x) => x.배점) * 100) / 100, 판정불가: 조각.filter((x) => x.판정 === '판정불가').map((x) => x.조각id), 조각 };
}

function 저장교사() { try { localStorage.setItem('hmos-d2-teacher:' + 기록키, JSON.stringify(교사)); } catch (_) {} }

function 그리기6() {
  if (!기록) { $('#p6').innerHTML = '<div class="sec-title">교사 확정</div>' + 비었음('채점 결과를 고르면 교사가 조각 판정을 확정할 수 있습니다.'); return; }
  $('#p6').innerHTML = '<div class="sec-title">교사 확정</div><div class="sec-sub">엔진 판정을 확인하고, 판정불가 조각은 O/X로 정하세요. 고친 판정은 이 브라우저에만 남고, 「확정 내려받기」로 JSON 파일을 받습니다. 원본 채점 결과는 바뀌지 않습니다.</div>' + 소문항들().map((s, i) => {
    const g = 채점of(s, i);
    if (!g?.out?.조각별) return '';
    const k = 자리(s, i);
    const 고침 = 교사[k] || {};
    const r = 재집계(g.out, 고침);
    return `<div class="card" data-k="${esc(k)}" data-i="${i}">
      ${s.번호 ? `<h3>소문항 (${esc(s.번호)})</h3>` : ''}
      <div class="cmp"><div>엔진<b>${점(g.out.부분점수)}</b></div><div>확정<b>${점(r.부분점수)}</b></div><div>만점 ${점(r.만점)}</div>${r.판정불가.length ? `<span class="tag un">아직 판정불가 ${r.판정불가.length}개</span>` : '<span class="tag">모든 조각 판정됨</span>'}</div>
      <div class="tbl-wrap" style="margin-top:12px"><table>
        <tr><th>조각</th><th>엔진</th><th>교사 확정</th><th>판단근거</th></tr>
        ${r.조각.map((x) => `<tr><td><b>${esc(x.조각id)}</b><div class="muted" style="font-size:12px">${esc(x.파트)} · ${점(x.배점)}</div></td><td>${표지(x.결과)}</td>
          <td><div class="fix"><div class="seg">${['O', 'X', '판정불가'].map((v) => `<button data-id="${esc(x.조각id)}" data-v="${v}" class="${x.판정 === v ? 'on ' + (v === '판정불가' ? 'U' : v) : ''}">${v === '판정불가' ? '?' : v}</button>`).join('')}</div>${x.판정 !== x.결과 ? '<span class="changed">고침</span>' : ''}</div></td>
          <td style="font-size:12.5px">${x.오류 ? `<b style="color:var(--no)">${esc(x.오류)}</b><br>` : ''}${esc(x.판단근거)}</td></tr>`).join('')}
      </table></div>
    </div>`;
  }).join('') + `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="run-btn" id="t-down">확정 내려받기 (JSON)</button><button class="ghost-btn" id="t-reset">교사 판정 지우기</button></div>`;
  document.querySelectorAll('#p6 .seg button').forEach((b) => b.addEventListener('click', () => {
    const card = b.closest('.card');
    const k = card.dataset.k, i = Number(card.dataset.i);
    const g = 채점of(소문항들()[i], i);
    const 엔진값 = g.out.조각별.find((x) => x.조각id === b.dataset.id)?.결과;
    교사[k] = { ...(교사[k] || {}) };
    if (b.dataset.v === 엔진값) delete 교사[k][b.dataset.id]; else 교사[k][b.dataset.id] = b.dataset.v;
    저장교사();
    그리기6();
  }));
  $('#t-reset').addEventListener('click', () => { 교사 = {}; 저장교사(); 그리기6(); });
  $('#t-down').addEventListener('click', 내려받기);
}

function 내려받기() {
  const 확정 = 소문항들().map((s, i) => {
    const g = 채점of(s, i);
    if (!g?.out?.조각별) return null;
    const 고침 = 교사[자리(s, i)] || {};
    const r = 재집계(g.out, 고침);
    return { 번호: s.번호 ?? null, 엔진점수: g.out.부분점수, 확정점수: r.부분점수, 만점: r.만점, 판정불가: r.판정불가, 고친조각: Object.entries(고침).map(([조각id, 교사판정]) => ({ 조각id, 엔진판정: g.out.조각별.find((x) => x.조각id === 조각id)?.결과, 교사판정 })) };
  }).filter(Boolean);
  const 글 = JSON.stringify({ 원본: 기록키, 학생: 기록.학생, 문항: 기록.문항, 엔진: (기록.채점 || [])[0]?.out?.엔진 || null, 확정일시: new Date().toISOString(), 소문항: 확정 }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([글], { type: 'application/json' }));
  a.download = (기록키.startsWith('파일:') ? 기록키.slice(3).replace(/\.json$/, '') : 'hmos_새채점') + '_교사확정.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── 탭7 채점 샘플 ── q3~q7 대표 답안 카드 (검증/ 폴더 JSON — /api/results 요약). 판정 · 오류 · 다경로는 엔진 출력 그대로, 화면은 고르기만 한다
//   고르기: 모범 · 학생N 파일만 (규칙반영 · 실채점 · 재채점 같은 작업 파일은 빼고), 「_최종」이 있으면 그 판
//   정답 경로 = 모범 + 만점이면서 🔆 다경로가 있는 답 · 오류 경로 = 오류 이름 묶음마다 대표 하나 (같은 오류인 학생은 카드 아래에)
const 학생번호 = (x) => Number((x.파일.match(/_학생(\d+)/) || [0, 0])[1]);
function 샘플고르기() {
  const 대상 = 목록.filter((x) => /^q[3-7]_(모범|학생\d+)(_최종)?_\d{8}\.json$/.test(x.파일));
  const 키 = (f) => f.replace('_최종', '').replace(/_\d{8}\.json$/, '');
  const 최종 = new Set(대상.filter((x) => x.파일.includes('_최종')).map((x) => 키(x.파일)));
  return 대상.filter((x) => x.파일.includes('_최종') || !최종.has(키(x.파일)));
}
const 만점임 = (x) => Number(x.부분점수) >= Number(x.만점) - 1e-9;
const 점띠 = (x) => `<div class="strip">${(x.조각 || []).map((c) => `<span class="dot ${c.결과 === 'O' ? 'O' : c.결과 === 'X' ? 'X' : 'U'}" title="${esc((c.번호 ? '(' + c.번호 + ') ' : '') + c.id + ' · ' + c.파트 + ' · ' + 점(c.득점) + '/' + 점(c.배점))}">${c.결과 === '판정불가' ? '?' : esc(c.결과)}</span>`).join('')}</div>`;
const 누구 = (x) => (x.파일.includes('_모범') ? '모범답안' : x.학생 || x.파일);

function 샘플카드(x, 갈래, 같은) {
  const 조각 = x.조각 || [];
  const 다 = [...new Set(조각.filter((c) => c.다경로).map((c) => c.다경로))];
  const 오류 = [...new Set(조각.filter((c) => c.오류).map((c) => c.오류))];
  const 자리 = (c) => `${c.번호 ? '(' + esc(c.번호) + ') ' : ''}${esc(c.id)}`;
  let 경로 = '', 어디 = '';
  if (갈래 === 'ok') {
    경로 = 다.length ? `<span class="m">🔆 ${다.map(esc).join(' · ')}</span>` : '모범 경로';
    어디 = 조각.filter((c) => c.다경로).map((c) => `${자리(c)} — ${esc(c.다경로식 || c.다경로)}`).join('<br>');
  } else {
    const X = 조각.filter((c) => c.결과 === 'X'), U = 조각.filter((c) => c.결과 === '판정불가');
    경로 = 오류.length ? 오류.map((e) => `<span class="e">${esc(e)}</span>`).join('<br>') : `오류 이름 없음 — X ${X.length}개${U.length ? ` · 판정불가 ${U.length}개` : ''}`;
    어디 = [...X, ...U].map((c) => `${자리(c)} ${esc(c.파트)} ${점(c.득점)}/${점(c.배점)}${c.오류 ? ' · ' + esc(c.오류) : c.결과 === '판정불가' ? ' · 판정불가' : ''}`).join('<br>');
  }
  const 꼴 = 갈래 === 'ok' ? (다.length ? 'multi-path' : 'ok') : 'no';
  return `<div class="sample ${꼴}" data-file="${esc(x.파일)}" title="눌러서 탭3에서 보기">
    <div class="sample-head"><span class="who">${esc(누구(x))}</span><span class="sc">${점(x.부분점수)} <small>/ ${점(x.만점)}</small></span></div>
    <div class="path-name">${경로}</div>
    ${어디 ? `<div class="where">${어디}</div>` : ''}
    ${점띠(x)}
    ${x.학생답 ? `<div class="ans">${esc(x.학생답)}</div>` : ''}
    ${같은 && 같은.length ? `<div class="same-err">같은 오류: ${같은.map((y) => esc(누구(y))).join(' · ')}</div>` : ''}
  </div>`;
}

// 계열 묶음 (오종래 2026-10-17): 수리 계열 = 채점 결과의 계열이 「수리」인 문항 · 인문·사회 계열 = 준비 중 자리
function 그리기7() {
  const 고른 = 샘플고르기().filter((x) => x.계열 === '수리');
  const 문항들 = [...new Set(고른.map((x) => x.문항번호))].sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
  const 수리 = 문항들.length ? 문항들.map((q) => 문항묶음(q, 고른)).join('') : 비었음('검증/ 폴더에 수리 계열 q3~q7 채점 결과가 없습니다.');
  $('#p7').innerHTML = '<div class="sec-title">채점 샘플</div><div class="sec-sub">대표 답안입니다. 검증/ 폴더 채점 결과 JSON에서 바로 읽습니다. 카드를 누르면 탭3에서 조각별로 볼 수 있습니다.</div>'
    + `<div class="field-lane"><span class="fname">수리 계열</span><span class="fsub">${문항들.map(esc).join(' · ')}</span></div>${수리}`
    + `<div class="field-lane later" style="margin-top:36px"><span class="fname">인문·사회 계열</span><span class="fsub">준비 중</span></div>
       <div class="wait">인문·사회 계열 채점 샘플은 준비 중입니다. 인문·사회 채점이 열리면 이 자리에 대표 답안이 들어옵니다.</div>`;
  document.querySelectorAll('#p7 .sample').forEach((el) => el.addEventListener('click', () => {
    $('#rec-select').value = el.dataset.file;
    열기(el.dataset.file).then(() => 탭(3));
  }));
}

/** 문항 하나의 정답 경로 · 오류 경로 카드 */
function 문항묶음(q, 고른) {
    const xs = 고른.filter((x) => x.문항번호 === q).sort((a, b) => 학생번호(a) - 학생번호(b));
    const 모범 = xs.filter((x) => x.파일.includes('_모범'));
    const 다경로 = xs.filter((x) => !x.파일.includes('_모범') && 만점임(x) && (x.조각 || []).some((c) => c.다경로));
    const 틀린 = xs.filter((x) => !x.파일.includes('_모범') && !만점임(x));
    // 오류 묶음 — 이름이 있으면 이름 묶음, 없으면 X · 판정불가 자리 묶음
    const 묶음 = new Map();
    for (const x of 틀린) {
      const 이름 = [...new Set((x.조각 || []).filter((c) => c.오류).map((c) => c.오류))].sort();
      const 키 = 이름.length ? '오류:' + 이름.join('|') : '자리:' + (x.조각 || []).filter((c) => c.결과 !== 'O').map((c) => `${c.번호}/${c.id}/${c.결과}`).join('|');
      if (!묶음.has(키)) 묶음.set(키, []);
      묶음.get(키).push(x);
    }
    const 문항글 = (xs.find((x) => x.문항) || {}).문항 || '';
    return `<div class="qgroup">
      <div class="qhead"><span class="qn">${esc(q)}</span><span class="muted" style="font-size:12px">답안 ${xs.length}개</span></div>
      <div class="qtext">${esc(문항글.length > 160 ? 문항글.slice(0, 160) + '…' : 문항글)}</div>
      <div class="lane ok">정답 경로 — 모범 ${다경로.length ? '+ 🔆 다경로 ' + 다경로.length : ''}</div>
      <div class="samples">${[...모범, ...다경로].map((x) => 샘플카드(x, 'ok')).join('') || '<span class="muted">없음</span>'}</div>
      <div class="lane no">오류 경로${묶음.size ? ' — ' + 묶음.size + '가지' : ''}</div>
      <div class="samples">${[...묶음.values()].map((g) => 샘플카드(g[0], 'no', g.slice(1))).join('') || '<span class="muted">감점된 답안 없음</span>'}</div>
    </div>`;
}

// ── 시작 ──
그리기();
try { const t = localStorage.getItem('hmos-d2-tab'); if (t) 탭(t); } catch (_) {}
목록받기();
</script>
