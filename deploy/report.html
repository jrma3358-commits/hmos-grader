<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMOS — 채점 리포트</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 채점 리포트 (오종래 2026-10-22) — /api/report 엔진 출력 그대로. 점수 · 4축 판정 · 조각 판정을 화면이 새로 매기지 않는다 (모으고 그리기만).
   3층: ① 문항별 점수 분포 ② 학생별 4축 지형도(막대 · 아직 안 편 이해의 좌표 · 강점 먼저) ③ 성장 궤적(q3 이전 vs 현재).
   청중 탭: 학생용(서술 · 숫자 최소) · 교사용(4축 수치 · 처방) · 학부모용(강점 먼저 · 성장 궤적). 서술 · 처방 문장은 엔진 판정에 붙이는 고정 문안 */
:root{--teal:#1A4A4A;--teal-mid:#2A6060;--teal-lt:#CFE3E0;--gold:#C8A84B;--gold-lt:#F6EFD9;--ivory:#F7F5F0;--ivory-dk:#EDE9E1;--line:#DDD8CC;--muted:#6B6B70;--ink:#1C1C1E;--white:#FFFFFF;
  --ok:#2E7D32;--ok-bg:#E8F5E9;--no:#C62828;--no-bg:#FFEBEE;--un:#8D6E00;--un-bg:#FFF8E1;--track:#ECEAE4}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--ivory);color:var(--ink);font-size:14px;line-height:1.65}
.topbar{min-height:54px;background:var(--teal);display:flex;align-items:center;padding:0 24px;gap:18px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.brand{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:600;color:#fff;text-decoration:none}
.brand em{font-style:normal;color:var(--gold);font-size:11px;font-family:'Noto Sans KR',sans-serif;font-weight:300;margin-left:6px}
.views{display:flex;gap:2px}
.views button{border:none;background:transparent;color:rgba(255,255,255,.6);font:inherit;font-size:14px;padding:0 14px;height:54px;border-bottom:3px solid transparent;cursor:pointer}
.views button:hover{color:#fff}
.views button[aria-selected="true"]{color:#fff;border-bottom-color:var(--gold);font-weight:600}
.back{margin-left:auto;color:var(--gold);font-size:13px;text-decoration:none}
.pick{background:var(--white);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:54px;z-index:9}
.pick label{font-size:12px;color:var(--muted)}
.pick select{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;background:var(--white)}
.pick .hint{font-size:12px;color:var(--muted)}
.content{max-width:1000px;margin:0 auto;padding:26px 24px 72px}
section{margin-bottom:38px}
.layer{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gold);margin-bottom:2px}
h2{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:600;color:var(--teal);margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:600;color:var(--teal);margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.empty,.err{padding:40px;text-align:center;color:var(--muted);background:var(--white);border:1px dashed var(--line);border-radius:8px}
.err{color:var(--no);background:var(--no-bg);border-color:var(--no)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--ivory-dk);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.no{background:var(--no-bg);color:var(--no)}.tag.un{background:var(--un-bg);color:var(--un)}.tag.gold{background:var(--gold-lt);color:#6B5418}
/* 강점 · 좌표 · 처방 */
.strong{background:var(--ok-bg);border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.strong b{color:var(--ok)}
.coord{border-left:3px solid var(--no);background:#FFFBFA;border-radius:0 6px 6px 0;padding:9px 13px;margin-top:12px;font-size:14px}
.coord.calm{border-left-color:var(--teal-mid);background:#F5FAF9}
.coord.wait{border-left-color:var(--un);background:#FFFDF5}
.coord .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;display:block}
.rx{margin-top:10px;font-size:13px;background:var(--gold-lt);border-radius:6px;padding:9px 13px}
.rx .k{font-size:11px;font-weight:700;color:#6B5418;display:block}
.rx li{margin-left:18px}
/* 4축 막대 */
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.bars .n{font-size:13px;white-space:nowrap}
.bars .n small{color:var(--muted);font-size:11px;margin-left:4px}
.bar{height:14px;background:var(--track);border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal-mid);border-radius:0 4px 4px 0;min-width:0}
.bar.top i{background:var(--teal)}
.bar.wait i{background:repeating-linear-gradient(45deg,var(--gold) 0 4px,var(--gold-lt) 4px 8px);width:100%!important;opacity:.6}
.bars .v{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
/* 분포 띠 · 성장 */
svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}
.axis{fill:var(--muted);font-size:11px}
.dot{fill:var(--teal-mid);stroke:var(--white);stroke-width:2;cursor:pointer}
.dot.me{fill:var(--gold);stroke:var(--ink);stroke-width:1.5}
.dot:hover,.dot:focus{fill:var(--gold);outline:none}
.model{fill:var(--white);stroke:var(--gold);stroke-width:2.5}
.mean{stroke:var(--teal);stroke-width:2}
.lbl{font-size:12px;fill:var(--ink)}
.before{fill:var(--white);stroke:#8A8A90;stroke-width:2}
.after{fill:var(--teal);stroke:var(--white);stroke-width:2}
.link{stroke:#9DC7C1;stroke-width:3;stroke-linecap:round}
.val{font-size:11px;fill:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.story{font-size:15px;line-height:1.85}
.story p+p{margin-top:8px}
details summary{cursor:pointer;font-size:13px;color:var(--teal);margin-top:8px}
/* 건강검진표 (통합 리포트) — 기호 칸 */
table.hc th{text-align:center}table.hc th:first-child{text-align:left}
table.hc td small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
table.hc td.mk{text-align:center;font-size:22px;line-height:1;vertical-align:middle;color:var(--teal)}
table.hc td.mk.half{color:var(--teal-mid)}table.hc td.mk.lo{color:var(--no)}table.hc td.mk.wait{color:var(--un);font-size:15px;font-weight:700}table.hc td.mk.none{color:var(--line)}
table.hc td.mk:last-child{background:var(--ivory)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:5px;max-width:280px;opacity:0;transition:opacity .1s;z-index:50;white-space:pre-line}
@media (max-width:760px){.topbar{padding:0 16px;gap:8px}.views button{padding:0 9px;font-size:13px}.back{display:none}.pick{padding:8px 16px}.content{padding:20px 16px 56px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/dashboard2">HMOS<em>채점 리포트</em></a>
  <div class="views" role="tablist">
    <button role="tab" data-view="student">학생용</button><button role="tab" data-view="teacher">교사용</button><button role="tab" data-view="parent">학부모용</button><button role="tab" data-view="integrated">통합 리포트</button>
  </div>
  <a class="back" href="/dashboard2">← 채점 대시보드</a>
</header>
<div class="pick" id="pick"></div>
<main class="content" id="main"><div class="empty">채점 결과를 불러오는 중…</div></main>
<div id="tip" role="tooltip"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const 점 = (x) => (Math.round(Number(x) * 100) / 100).toString();
const 비율 = (a, b) => (b > 0 ? a / b : 0);
const 퍼 = (x) => Math.round(x * 100) + '%';
const 축들 = ['근거대기', '세우기', '풀기', '답구하기'];
const 학생순 = (a, b) => (a.학생 === '모범' ? -1 : b.학생 === '모범' ? 1 : a.학생.localeCompare(b.학생, 'ko', { numeric: true }));
const 저장 = { get: (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };

// ── 고정 문안 — 축이 뜻하는 단계 · 학생에게 다음 걸음 · 교사 처방 (엔진 판정에 붙이기만, 판정을 바꾸지 않는다) ──
const 축뜻 = { 근거대기: '문제의 조건과 개념을 확인하는', 세우기: '조건을 식으로 세우는', 풀기: '세운 식을 이어 계산하는', 답구하기: '문제가 묻는 답을 내는' };
const 다음걸음 = {
  근거대기: '풀기 전에 문제 조건과 쓰일 개념(공식 이름)을 한 줄로 먼저 적어 보세요.',
  세우기: '조건 하나하나가 식의 어느 부분이 되는지 짝지어 보세요.',
  풀기: '계산을 한 줄에 한 단계씩, 중간 값을 적어 가며 이어 보세요.',
  답구하기: '마지막 줄에 문제가 묻는 값을 문제의 꼴 그대로 다시 써 보세요.',
};
const 처방 = {
  근거대기: '개념 확인 발문 — 「이 문제에 쓰이는 조건 · 공식은?」을 풀이 첫 줄로 쓰게 한다',
  세우기: '학생 식과 모범 식을 나란히 놓고 다른 항 · 빠진 처리를 학생이 찾게 한다',
  풀기: '중간 값을 줄마다 적게 하고, 한 줄씩 검산하게 한다',
  답구하기: '결론 줄을 문제가 묻는 대상 · 꼴(값 · 범위 · 단위)로 다시 쓰게 한다',
};

// ── 학생 하나 읽기 — 축마다 비율 · 확인 중 여부, 강점, 처음 막힌 좌표 ──
function 읽기(x) {
  const 축 = x.축.map((a) => {
    const 조각 = x.막힘.filter((b) => b.파트 === a.이름);
    const 진짜X = 조각.some((b) => b.결과 === 'X' && !b.엔진확인);
    // 엔진 X가 「정답 값 여럿」 한 칸뿐이거나 교사 판정 대기면 「확인 중」 — 학생 · 학부모에게 틀렸다고 보이지 않는다
    const 확인중 = !진짜X && 조각.some((b) => b.결과 === '판정불가' || b.엔진확인);
    return { ...a, r: 비율(a.점수, a.배점), 확인중, 진짜X };
  }).filter((a) => a.배점 > 0);
  const 다진 = 축.filter((a) => !a.확인중);
  const 최고 = 다진.length ? Math.max(...다진.map((a) => a.r)) : 0;
  const 강점 = 다진.filter((a) => a.r === 최고 && 최고 > 0);
  const 순 = [...x.막힘].sort((a, b) => 축들.indexOf(a.파트) - 축들.indexOf(b.파트));
  const 막힌곳 = 순.find((b) => b.결과 === 'X' && !b.엔진확인) || null;
  const 대기 = 순.filter((b) => b.결과 === '판정불가' || b.엔진확인);
  return { 축, 강점, 막힌곳, 대기, 모두O: 다진.length === 축.length && 다진.every((a) => a.r >= 0.999) };
}
const 첫줄 = (t) => { const s = String(t || '').split('\n').map((l) => l.trim()).filter(Boolean); const l = s[s.length - 1] || ''; return l.length > 40 ? l.slice(0, 40) + '…' : l; };
const 이어 = (xs) => xs.map((a) => a.이름).join(' · ');

/** 「아직 안 편 이해의 좌표」 한 줄 — 청중마다 말만 다르다 */
function 좌표줄(x, 읽, 청중) {
  const b = 읽.막힌곳;
  if (!b) {
    if (읽.대기.length) return { 꼴: 'wait', 글: 청중 === '교사' ? `막힌 곳 없음 — 교사 판정 ${읽.대기.filter((d) => d.결과 === '판정불가').length}칸 · 엔진 확인 ${읽.대기.filter((d) => d.엔진확인).length}칸이 남았습니다` : 청중 === '학부모' ? '눈에 띄게 막힌 곳은 없습니다. 몇 군데는 선생님이 한 번 더 확인하고 있습니다.' : '눈에 띄게 막힌 곳은 없어요. 몇 군데는 선생님이 한 번 더 확인하고 있어요.' };
    return { 꼴: 'calm', 글: 청중 === '학생' ? '모든 단계를 끝까지 펼쳤어요. 막힌 곳이 없어요.' : 청중 === '학부모' ? '풀이의 모든 단계를 끝까지 해냈습니다.' : '막힌 곳 없음 — 모든 조각 O' };
  }
  const 곳 = `${b.번호 != null ? `(${b.번호}) ` : ''}「${첫줄(b.글) || '(쓰지 않음)'}」`;
  if (청중 === '학생') return { 꼴: '', 글: `${곳} — ${축뜻[b.파트]} 단계에서 아직 이해가 펴지지 않았어요.` };
  if (청중 === '학부모') return { 꼴: '', 글: `${축뜻[b.파트]} 단계(${b.파트})를 조금 더 다지면 풀이가 끝까지 이어집니다.` };
  return { 꼴: '', 글: `${b.파트} ${b.id} ${곳} — ${b.근거}` };
}

/** 4축 막대 — 강점 먼저(학생 · 학부모) / 축 순서 그대로(교사) */
function 막대(읽, 청중) {
  const 줄 = 청중 === '교사' ? 읽.축 : [...읽.축].sort((a, b) => (a.확인중 - b.확인중) || (b.r - a.r) || (축들.indexOf(a.이름) - 축들.indexOf(b.이름)));
  const 말 = (a) => (a.확인중 ? '확인 중' : a.r >= 0.999 ? '탄탄해요' : a.r >= 0.5 ? '거의 왔어요' : a.r > 0 ? '다지는 중' : '아직 펴지 않았어요');
  return `<div class="bars">${줄.map((a) => {
    const 강 = 읽.강점.includes(a);
    const 값 = 청중 === '교사' ? `${점(a.점수)} / ${점(a.배점)} · ${퍼(a.r)} ${a.판정 === 'O' ? '✓' : a.판정 === 'X' ? '✕' : a.판정 === '판정불가' ? '?' : ''}` : 청중 === '학부모' ? (a.확인중 ? '확인 중' : 퍼(a.r)) : 말(a);
    return `<div class="n">${강 ? '★ ' : ''}${esc(a.이름)}${청중 === '학생' ? `<small>${esc(축뜻[a.이름])}</small>` : ''}</div>
      <div class="bar ${강 ? 'top' : ''} ${a.확인중 ? 'wait' : ''}" role="img" aria-label="${esc(a.이름)} ${esc(값)}" tabindex="0" data-tip="${esc(a.이름)} — ${esc(a.확인중 ? '선생님 확인 중' : 청중 === '학생' ? 말(a) : `${점(a.점수)} / ${점(a.배점)} (${퍼(a.r)})`)}"><i style="width:${(a.r * 100).toFixed(1)}%"></i></div>
      <div class="v">${esc(값)}</div>`;
  }).join('')}</div>`;
}

function 강점줄(x, 읽, 청중) {
  if (읽.모두O) return 청중 === '교사' ? '<b>강점</b> 4축 모두 만점' : `<b>잘한 점</b> ${청중 === '학생' ? '조건 확인부터 답까지 모든 단계를 해냈어요.' : '조건 확인부터 답까지 풀이의 모든 단계를 해냈습니다.'}`;
  if (!읽.강점.length) return 청중 === '교사' ? '<b>강점</b> 아직 다진 축 없음' : `<b>잘한 점</b> 끝까지 답안을 써 냈어요. 이제 한 단계씩 다져 가면 돼요.`;
  const 이름 = 이어(읽.강점);
  if (청중 === '교사') return `<b>강점</b> ${esc(이름)} (${퍼(읽.강점[0].r)})`;
  const 뜻 = 읽.강점.map((a) => 축뜻[a.이름].replace(/는$/, '기')).join(', ');
  return 청중 === '학생' ? `<b>잘한 점</b> ${esc(뜻)} — ${esc(이름)} 단계가 가장 탄탄해요.` : `<b>강점</b> ${esc(이름)} — ${esc(뜻)}를 가장 잘 해냈습니다.`;
}

// ── 1층 문항별 점수 분포 ──
function 분포띠(q, xs, 나) {

// 툴팁 — 마크마다 data-tip (마우스 · 키보드 초점)
const tip = $('#tip');
document.addEventListener('pointerover', (e) => { const t = e.target.closest('[data-tip]'); if (!t) return; tip.textContent = t.dataset.tip; tip.style.opacity = 1; });
document.addEventListener('pointermove', (e) => { if (tip.style.opacity !== '1') return; tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + 'px'; tip.style.top = e.clientY + 14 + 'px'; });
document.addEventListener('pointerout', (e) => { if (e.target.closest('[data-tip]')) tip.style.opacity = 0; });
document.addEventListener('focusin', (e) => { const t = e.target.closest('[data-tip]'); if (!t) return; const r = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.style.left = Math.min(r.right + 6, innerWidth - 290) + 'px'; tip.style.top = r.top + 'px'; tip.style.opacity = 1; });
document.addEventListener('focusout', () => { tip.style.opacity = 0; });

(async () => {
  try {
    const r = await fetch('/api/report', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    목록 = j.목록;
  } catch (e) { $('#main').innerHTML = `<div class="err">리포트를 불러오지 못했습니다 — ${esc(e.message)}</div>`; return; }
  if (!목록.length) { $('#main').innerHTML = '<div class="empty">학생 경로 채점 B로 재채점한 결과가 아직 없습니다.</div>'; return; }
  const v = new URLSearchParams(location.search).get('view') || 저장.get('hmos-report-view');
  if (청중이름[v]) 청중 = v;
  나키 = 저장.get('hmos-report-me');
  통합번호 = Number(저장.get('hmos-report-int')) || null;
  그리기();
})();
</script>
