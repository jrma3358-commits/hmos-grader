# HMOS — hmos.hunminos.com → node 127.0.0.1:3000 (~/hmos/server.js, pm2 hmos)
# 옛 서버(43.201.35.52) 설정 deploy/nginx/hmos.conf를 옮김 (2026-10-14, 새 서버 3.35.141.46)
server {
    server_name hmos.hunminos.com;

    client_max_body_size 20m;

    # / 는 홈(home.html) — server.js가 내준다. 대시보드는 /dashboard (접속 비밀번호, 2026-10-14)

    # 엔진 폴더·소스·설정 파일은 밖으로 내주지 않는다 (2026-10-13)
    location ^~ /hmos-grader { return 404; }
    location ~* \.(ts|mts|json|bundle)$ { return 404; }
    location = /server.js { return 404; }
    location ~* \.bak { return 404; }
    location ~ /\. { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 정교화안·추가 논제는 Claude 호출 + 엔진 재인식을 하나씩 돌려 몇 분 걸린다 (옛 서버 300s → 600s)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hmos.hunminos.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hmos.hunminos.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = hmos.hunminos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name hmos.hunminos.com;
    return 404; # managed by Certbot
}
