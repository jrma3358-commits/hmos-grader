<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMOS — 시연 안내</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 시연 안내 (오종래 2026-10-21) — 상단 탭 3개(① 질문 설계 도구 ② 문항 분석 ③ 채점 대시보드) · 탭마다 단계 카드 (← → 버튼 · 방향키)
   카드: 단계 번호 · 제목 · 화면에서 할 것 · 설명 멘트 · 소요 시간. 단계 이름과 버튼 이름은 각 화면(tools.html · hmos_dashboard.html · dashboard2.html) 그대로 */
:root{--teal:#1A4A4A;--teal-mid:#2A6060;--gold:#C8A84B;--gold-lt:#F6EFD9;--ivory:#F7F5F0;--ivory-dk:#EDE9E1;--line:#DDD8CC;--muted:#6E6E73;--ink:#1C1C1E;--white:#fff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;font-size:15px;line-height:1.6}
button{font-family:inherit}
.topbar{background:var(--teal);display:flex;align-items:center;gap:4px;padding:0 24px;min-height:58px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.brand{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:600;color:#fff;margin-right:24px;text-decoration:none;white-space:nowrap}
.brand em{font-style:normal;color:var(--gold);font-size:12px;font-family:'Noto Sans KR',sans-serif;font-weight:300;margin-left:6px}
.tab{display:flex;align-items:center;gap:8px;height:58px;padding:0 16px;border:none;background:transparent;color:rgba(255,255,255,.6);font-size:14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--gold);font-weight:500}
.tab .n{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(255,255,255,.14)}
.tab.on .n{background:var(--gold);color:var(--teal);font-weight:700}
.wrap{flex:1;width:100%;max-width:960px;margin:0 auto;padding:28px 24px 48px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-family:'Noto Serif KR',serif;font-size:22px;color:var(--teal);font-weight:600}
.head .total{font-size:13px;color:var(--muted)}
.head a.open{margin-left:auto;font-size:13px;color:var(--teal);border:1.5px solid var(--teal);border-radius:6px;padding:5px 12px;text-decoration:none;white-space:nowrap}
.head a.open:hover{background:var(--white)}
.lead{font-size:14px;color:var(--muted);margin-bottom:10px}
.sample{display:inline-block;font-size:13.5px;color:var(--teal);background:var(--gold-lt);border:1px solid var(--gold);border-radius:6px;padding:4px 12px;margin-bottom:16px;text-decoration:none}
.sample:hover{background:var(--white)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dot{min-width:30px;height:28px;padding:0 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--white);font-size:12.5px;color:var(--muted);cursor:pointer}
.dot.on{border-color:var(--teal);background:var(--teal);color:#fff;font-weight:600}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:26px 30px;min-height:420px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.step{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;color:var(--teal);background:var(--gold-lt);border:1.5px solid var(--gold);border-radius:8px;padding:4px 12px;white-space:nowrap}
.card h2{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:600;color:var(--ink);line-height:1.35}
.time{margin-left:auto;font-size:13px;color:var(--teal);background:var(--ivory);border-radius:14px;padding:4px 12px;white-space:nowrap}
.sec .label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.sec ol,.sec ul{padding-left:20px;display:flex;flex-direction:column;gap:5px}
.sec li{font-size:15px}
.btnname{font-weight:600;color:var(--teal);white-space:nowrap}
.say{border-left:4px solid var(--gold);background:var(--gold-lt);border-radius:0 8px 8px 0;padding:14px 18px;font-size:16px;line-height:1.7;color:#3D3215}
.say::before{content:'멘트';display:block;font-size:11.5px;font-weight:700;color:#8A6A10;letter-spacing:.06em;margin-bottom:4px}
.note{font-size:13px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;margin-top:16px}
.nav button{padding:11px 22px;border-radius:8px;border:none;font-size:14.5px;cursor:pointer}
.prev{background:var(--ivory-dk);color:var(--ink)}
.next{background:var(--teal);color:#fff;margin-left:auto}
.nav button:disabled{opacity:.4;cursor:not-allowed}
.pos{font-size:13px;color:var(--muted)}
.keys{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
@media (max-width:760px){
  .topbar{flex-wrap:nowrap;overflow-x:auto;padding:0 16px}
  .brand{margin-right:10px}
  .tab{padding:0 10px;font-size:13px}
  .wrap{padding:20px 16px 40px}
  .card{padding:20px 18px;min-height:0}
  .card h2{font-size:20px}
  .time{margin-left:0}
}
</style>
</head>
<body>
<nav class="topbar">
  <a class="brand" href="/">HMOS <em>시연 안내</em></a>
  <button class="tab" data-tab="0"><span class="n">1</span>질문 설계 도구</button>
  <button class="tab" data-tab="1"><span class="n">2</span>문항 분석</button>
  <button class="tab" data-tab="2"><span class="n">3</span>채점 대시보드</button>
</nav>
<main class="wrap">
  <div class="head"><h1 id="t-name"></h1><span class="total" id="t-total"></span><a class="open" id="t-open" target="_blank" rel="noopener">화면 열기 ↗</a></div>
  <div class="lead" id="t-lead"></div>
  <a class="sample" id="t-sample" target="_blank" rel="noopener"></a>
  <div class="dots" id="dots"></div>
  <article class="card" id="card"></article>
  <div class="nav"><button class="prev" id="prev">← 이전</button><span class="pos" id="pos"></span><button class="next" id="next">다음 →</button></div>
  <div class="keys">방향키 ← → 로 카드를 넘기고, 1 · 2 · 3 으로 탭을 바꿉니다.</div>
</main>

      { 단계: '②', 제목: '문항분석', 시간: 2,
        할것: ['「문항분석」 — 5색 노드 · 급소 → 루브릭 → 모범답안이 한 화면에', '확인하고 「답안 입력 →」'],
        멘트: '채점 전에 무엇으로 채점하는지를 먼저 보여 줍니다. 급소, 조각, 배점, 모범답안 — 학생도 교사도 같은 기준을 봅니다.' },
      { 단계: '③', 제목: '답안 입력', 시간: 1,
        할것: ['학생 이름과 답안을 넣는다 (글 · 파일 · 손글씨 사진)', '「채점 →」 — 풀이1을 먼저'],
        멘트: '풀이1은 같은 문자 a를 「÷2!」 대신 경우를 나눠 셌습니다. 모범답안과 다른 길입니다.' },
      { 단계: '④', 제목: '채점 결과 — 풀이1 (다른 길, 정답)', 시간: 3,
        할것: ['학생 경로 채점 점수 5.0 / 5.0과 4축 카드를 본다', '「학생 답안 루브릭 추출 대조표」 — 엔진 조각 · 학생 조각 · 일치 / 다경로 / 불일치', '조각마다 🔆 다경로 표시와 계산 검증 근거를 본다'],
        멘트: '모범답안과 다른 길이어도 오답이 아닙니다. 학생이 간 길 안에서 계산이 맞는지를 엔진이 하나하나 검증합니다 — 4! = 24, 2 × 4! = 48, 24 + 48 = 72. 그래서 만점입니다.' },
      { 단계: '④', 제목: '채점 결과 — 풀이2 (어디서 틀렸나)', 시간: 3,
        할것: ['③으로 돌아가 풀이2를 넣고 「채점 →」', '세우기 「2×2=4」 · 풀기 「4×24=96」은 계산 O, 답구하기 96 ≠ 72는 X — 2.8 / 5.0', '「모범답안 같은 단계 값 3과 다름 — 교사 확인」 경고를 본다', '「채점 결과 저장」으로 검증/채점결과/에 남긴다'],
        멘트: '계산은 모두 맞았지만, 양 끝 모음을 2 × 2 = 4로 세운 것이 틀렸습니다. 같은 것이 있는 순열을 놓친 거죠. 점수만이 아니라 무너진 지점이 정확히 어디인지를 보여 줍니다.' },
      { 단계: '⑤', 제목: '교사 확정', 시간: 1,
        할것: ['조각마다 엔진 판정을 확인하고 필요하면 O / X를 고친다', '「확정 내려받기 (JSON)」'],
        멘트: '엔진은 근거를 남기고, 마지막 판정은 교사가 합니다. 고친 판정은 점수에 바로 다시 반영됩니다.' },
    ],
  },
];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
/** 「버튼 이름」을 굵게 */
const 버튼 = (t) => esc(t).replace(/「([^」]+)」/g, '<span class="btnname">「$1」</span>');
let 탭 = 0, 장 = 0;

function 그리기() {
  const t = 탭들[탭], c = t.카드[장];
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', Number(b.dataset.tab) === 탭));
  $('#t-name').textContent = t.이름;
  $('#t-total').textContent = `카드 ${t.카드.length}장 · 약 ${t.카드.reduce((a, x) => a + x.시간, 0)}분`;
  $('#t-open').href = t.주소;
  $('#t-lead').textContent = t.안내;
  $('#t-sample').textContent = `샘플: ${t.샘플} ↗`;
  $('#t-sample').href = t.주소 + t.샘플열기;
  $('#dots').innerHTML = t.카드.map((x, i) => `<button class="dot${i === 장 ? ' on' : ''}" data-i="${i}" title="${esc(x.제목)}">${esc(x.단계)}</button>`).join('');
  document.querySelectorAll('#dots .dot').forEach((b) => b.addEventListener('click', () => 가기(탭, Number(b.dataset.i))));
  $('#card').innerHTML = `
    <div class="card-top"><span class="step">${/^\d+$/.test(c.단계) ? c.단계 + '단계' : esc(c.단계)}</span><h2>${esc(c.제목)}</h2><span class="time">⏱ 약 ${c.시간}분</span></div>
    <div class="sec"><div class="label">화면에서 할 것</div><ol>${c.할것.map((x) => `<li>${버튼(x)}</li>`).join('')}</ol></div>
    <div class="say">${esc(c.멘트)}</div>
    ${c.덧 ? `<div class="note">${버튼(c.덧)}</div>` : ''}`;
  $('#prev').disabled = 탭 === 0 && 장 === 0;
  $('#next').disabled = 탭 === 탭들.length - 1 && 장 === t.카드.length - 1;
  $('#next').textContent = 장 === t.카드.length - 1 && 탭 < 탭들.length - 1 ? `${탭들[탭 + 1].이름} →` : '다음 →';
  $('#pos').textContent = `${장 + 1} / ${t.카드.length}`;
  history.replaceState(null, '', `#${탭 + 1}-${장 + 1}`);
}
function 가기(t, i) { 탭 = Math.max(0, Math.min(탭들.length - 1, t)); 장 = Math.max(0, Math.min(탭들[탭].카드.length - 1, i)); 그리기(); }
/** 앞뒤 — 탭 끝에서 다음 탭 첫 카드로, 첫 카드에서 앞 탭 끝 카드로 */
function 다음() { 장 < 탭들[탭].카드.length - 1 ? 가기(탭, 장 + 1) : 탭 < 탭들.length - 1 && 가기(탭 + 1, 0); }
function 이전() { 장 > 0 ? 가기(탭, 장 - 1) : 탭 > 0 && 가기(탭 - 1, 탭들[탭 - 1].카드.length - 1); }

document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => 가기(Number(b.dataset.tab), 0)));
$('#next').addEventListener('click', 다음);
$('#prev').addEventListener('click', 이전);
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('input, textarea')) return;
  if (e.key === 'ArrowRight') 다음();
  else if (e.key === 'ArrowLeft') 이전();
  else if (['1', '2', '3'].includes(e.key)) 가기(Number(e.key) - 1, 0);
});
// 주소 #탭-카드 (예: #3-4) — 시연 중 새로 고쳐도 · 링크로 와도 그 카드로
const 주소로 = () => { const m = location.hash.match(/^#(\d)-(\d+)$/); m ? 가기(Number(m[1]) - 1, Number(m[2]) - 1) : 그리기(); };
window.addEventListener('hashchange', 주소로);
주소로();
</script>
</body>
</html>
